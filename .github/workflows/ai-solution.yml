name: AI Solution acquisition verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ai-solution-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring
          coverage: none
      - name: Offline intake and rendered pages
        run: php tools/test-ai-solution-intake.php
      - name: Desktop and 390px mobile layout
        run: node tools/test-ai-solution-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-solution-preview
          path: artifacts/ai-solution-preview/
      - name: Existing tracking, attribution and presentation contracts
        run: |
          node tools/test-ai-audit-presentation.mjs
          node tools/test-audit-landing-tracking.mjs
          node tools/test-hubspot-attribution-contract.mjs
