name: PHP syntax
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php-syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every tracked PHP file
        run: node tools/test-php-syntax.mjs
      - name: Article → service page map (breadcrumb silo)
        run: php tools/test-post-service-hub.php
      - name: Founder avatar contract
        run: php tools/test-founder-avatar.php
      - name: Generated meta descriptions (Thai-aware length)
        run: php tools/test-meta-excerpt.php
      - name: Sitemap cache, llms.txt and meta map contract
        run: php tools/test-sitemap-llms.php
