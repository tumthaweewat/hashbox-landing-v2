name: Typography CI contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check font roles and generated CSS
        run: node tools/test-typography-contract.mjs
      - name: Check author page breadcrumb, Thai font and width
        run: node tools/test-author-page.mjs
      - name: One H1 on editor-built pages
        run: node tools/test-page-single-h1.mjs
